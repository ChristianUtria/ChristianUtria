name: Update Credly Cards

on:
  schedule:
    - cron: "0 9 * * 1"   # every Monday 9am UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Credly cards
        run: python3 scripts/generate_credly_cards.py christian-utria --out-dir .

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add credly-dark.svg credly-light.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update Credly badge cards"
            git push
          fi
